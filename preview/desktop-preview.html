<!DOCTYPE html>
<html lang="zh-CN" data-theme="obsidian-gold">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Aura Desktop — 真实网关生产客户端</title>
  <style>
/* ==========================================================================
   HERMES AURA DESKTOP — CORE STYLES & DESIGN TOKENS
   Strict adherence to desktop-design-system-spec.md (v3.0)
   ========================================================================== */

:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "SF Mono", monospace;

  --radius-window: 14px;
  --radius-panel: 10px;
  --radius-card: 10px;
  --radius-inner: 6px;
  --radius-pill: 9999px;

  --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
  --duration-fast: 140ms;
  --duration-normal: 240ms;
}

/* THEME A: OBSIDIAN GOLD (黑曜琥珀) */
[data-theme="obsidian-gold"] {
  --bg-window: #090A0F;
  --bg-rail: #0E1015;
  --bg-panel: #111318;
  --bg-card: #151720;
  --bg-card-hover: #1B1E29;
  --bg-card-active: #222634;
  --bg-elevated: #1F2230;
  --bg-input: #12141A;
  --bg-code: #0A0B10;
  --bg-backdrop: rgba(18, 20, 27, 0.88);

  --accent: #F59E0B;
  --accent-hover: #FBBF24;
  --accent-dim: #D97706;
  --accent-glow: rgba(245, 158, 11, 0.25);
  --accent-subtle: rgba(245, 158, 11, 0.09);
  --accent-border: rgba(245, 158, 11, 0.35);
  --accent-text: #FEF3C7;

  --text-main: #F8FAFC;
  --text-secondary: #94A3B8;
  --text-muted: #64748B;
  --text-faint: #334155;

  --border-subtle: rgba(255, 255, 255, 0.06);
  --border-medium: rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.16);
  --specular-line: inset 0 1px 0 0 rgba(255, 255, 255, 0.10);

  --shadow-window: 0 24px 70px -12px rgba(0, 0, 0, 0.85);
  --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.45);
  --shadow-dock: 0 20px 48px -10px rgba(0, 0, 0, 0.75);

  --jade-pulse: #10B981;
  --jade-glow: rgba(16, 185, 129, 0.45);
}

/* THEME B: SUET WHITE JADE (羊脂白玉) */
[data-theme="suet-jade"],
[data-theme="jade-white"] {
  --bg-window: #F4F6F9;
  --bg-rail: #E9ECF2;
  --bg-panel: #FAFAFC;
  --bg-card: #FFFFFF;
  --bg-card-hover: #F1F4F9;
  --bg-card-active: #E5E9F2;
  --bg-elevated: #FFFFFF;
  --bg-input: #FFFFFF;
  --bg-code: #F4F6FA;
  --bg-backdrop: rgba(255, 255, 255, 0.90);

  --accent: #0D7A5E;
  --accent-hover: #0B6850;
  --accent-dim: #095743;
  --accent-glow: rgba(13, 122, 94, 0.20);
  --accent-subtle: rgba(13, 122, 94, 0.08);
  --accent-border: rgba(13, 122, 94, 0.32);
  --accent-text: #08523F;

  --text-main: #0F172A;
  --text-secondary: #475569;
  --text-muted: #64748B;
  --text-faint: #94A3B8;

  --border-subtle: rgba(0, 0, 0, 0.06);
  --border-medium: rgba(0, 0, 0, 0.10);
  --border-strong: rgba(0, 0, 0, 0.18);
  --specular-line: inset 0 1px 0 0 rgba(255, 255, 255, 0.90);

  --shadow-window: 0 24px 60px -12px rgba(15, 23, 42, 0.18);
  --shadow-card: 0 2px 12px rgba(15, 23, 42, 0.06);
  --shadow-dock: 0 16px 40px -10px rgba(15, 23, 42, 0.14);

  --jade-pulse: #059669;
  --jade-glow: rgba(5, 150, 105, 0.40);
  --theme-thumb-color: #FFFFFF;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: var(--font-sans);
  background: var(--bg-window);
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

#aura-app-root {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

.aura-body-container {
  flex: 1;
  min-height: 0;
  display: flex;
  position: relative;
  overflow: hidden;
}

/* Scrollbar Customization */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(148, 163, 184, 0.2);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(148, 163, 184, 0.35);
}

/* Animations */
@keyframes aura-pulse {
  0%, 100% {
    transform: scale(1);
    opacity: 0.85;
  }
  50% {
    transform: scale(1.3);
    opacity: 1;
  }
}

/* Windows Caption Buttons Hover */
.win-cap-btn:hover {
  background: rgba(255, 255, 255, 0.08) !important;
  color: var(--text-main) !important;
}

.win-cap-close:hover {
  background: #E81123 !important;
  color: #FFFFFF !important;
}

/* Buttons and Interactive Elements */
button {
  font-family: inherit;
  transition: all var(--duration-fast) ease;
}

button:active {
  transform: scale(0.97);
}

.session-item:hover {
  background: var(--bg-card-hover) !important;
}

.seg-btn:hover {
  opacity: 0.9;
}

.send-action-btn:hover {
  filter: brightness(1.1);
  box-shadow: 0 0 12px var(--accent-glow);
}

  </style>
</head>
<body>
  <div id="aura-app-root"></div>
  <script>
// ../ui/src/components/Titlebar/Titlebar.ts
function renderTitlebar(props) {
  const isWin = props.platform === "windows";
  const macControls = `
    <div class="mac-traffic-lights" style="-webkit-app-region: no-drag; display: flex; gap: 7px; align-items: center; padding-left: 12px;">
      <span class="traffic-btn traffic-close" title="\u5173\u95ED" style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F56; display: inline-block; cursor: pointer;"></span>
      <span class="traffic-btn traffic-min" title="\u6700\u5C0F\u5316" style="width: 12px; height: 12px; border-radius: 50%; background: #FFBD2E; display: inline-block; cursor: pointer;"></span>
      <span class="traffic-btn traffic-max" title="\u5168\u5C4F" style="width: 12px; height: 12px; border-radius: 50%; background: #27C93F; display: inline-block; cursor: pointer;"></span>
    </div>
  `;
  const winControls = `
    <div class="win-caption-controls" style="-webkit-app-region: no-drag; display: flex; align-items: center; height: 100%;">
      <button class="win-cap-btn" id="win-min-btn" title="\u6700\u5C0F\u5316" style="width: 44px; height: 42px; border: none; background: transparent; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s ease;">
        <svg width="11" height="1" viewBox="0 0 11 1"><rect width="11" height="1" fill="currentColor"/></svg>
      </button>
      <button class="win-cap-btn" id="win-max-btn" title="${props.isMaximized ? "\u8FD8\u539F" : "\u6700\u5927\u5316"}" style="width: 44px; height: 42px; border: none; background: transparent; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s ease;">
        ${props.isMaximized ? `<svg width="11" height="11" viewBox="0 0 11 11"><path d="M2.5 0h8.5v8.5h-2v2.5h-8.5v-8.5h2v-2.5zm1 1v1.5h6v6h1.5v-7.5h-7.5zm-2 2.5v7.5h7.5v-7.5h-7.5zm1 1h5.5v5.5h-5.5v-5.5z" fill="currentColor"/></svg>` : `<svg width="11" height="11" viewBox="0 0 11 11"><rect x="0.5" y="0.5" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>`}
      </button>
      <button class="win-cap-btn win-cap-close" id="win-close-btn" title="\u5173\u95ED" style="width: 46px; height: 42px; border: none; background: transparent; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s ease;">
        <svg width="11" height="11" viewBox="0 0 11 11"><path d="M0.5 0.5l10 10m0-10l-10 10" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  `;
  const pulseColor = props.gatewayConnected ? "#10B981" : "#64748B";
  const pulseGlow = props.gatewayConnected ? "rgba(16, 185, 129, 0.45)" : "none";
  const displayTitle = props.title || (props.gatewayConnected ? "Hermes Aura \u2014 \u8BF7\u9009\u62E9\u6216\u65B0\u5EFA\u4F1A\u8BDD" : "\u672A\u8FDE\u63A5\u7F51\u5173");
  return `
    <header class="aura-titlebar" style="
      height: 42px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-rail);
      user-select: none;
      -webkit-app-region: drag;
      position: relative;
      z-index: 50;
    ">
      <!-- Left Wing (250px) -->
      <div class="titlebar-left" style="display: flex; align-items: center; width: 250px; min-width: 250px; gap: 8px;">
        ${!isWin ? macControls : ""}
        <button id="toggle-left-rail-btn" class="icon-btn" title="\u6298\u53E0/\u5C55\u5F00\u4FA7\u680F (Ctrl+B)" style="
          -webkit-app-region: no-drag;
          margin-left: ${isWin ? "12px" : "6px"};
          background: transparent;
          border: 1px solid var(--border-subtle);
          border-radius: 6px;
          color: var(--text-secondary);
          width: 28px;
          height: 28px;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
        ">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="2" width="12" height="12" rx="2"/>
            <line x1="6" y1="2" x2="6" y2="14"/>
          </svg>
        </button>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: var(--text-muted); text-transform: uppercase;">AURA DESKTOP</span>
      </div>

      <!-- Center Focus Area (Flex: 1) -->
      <div class="titlebar-center" style="display: flex; align-items: center; justify-content: center; flex: 1; min-width: 0; gap: 8px;">
        <span class="session-live-pulse" title="${props.gatewayConnected ? "\u7F51\u5173\u5DF2\u8FDE\u63A5" : "\u7F51\u5173\u672A\u8FDE\u63A5"}" style="
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: ${pulseColor};
          box-shadow: 0 0 8px ${pulseGlow};
          display: inline-block;
          ${props.gatewayConnected ? "animation: aura-pulse 2.4s infinite cubic-bezier(0.4, 0, 0.6, 1);" : ""}
        "></span>
        <span class="session-title-text" style="
          font-size: 13px;
          font-weight: 500;
          color: var(--text-main);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          max-width: 520px;
        ">${escapeHtml(displayTitle)}</span>
      </div>

      <!-- Right Global Auxiliary Area (250px) -->
      <div class="titlebar-right" style="display: flex; align-items: center; justify-content: flex-end; width: 250px; min-width: 250px; gap: 8px; height: 100%;">
        <div style="-webkit-app-region: no-drag; display: flex; align-items: center; gap: 6px; margin-right: 8px;">
          <!-- Settings gear icon button -->
          <button id="btn-open-settings" class="icon-btn" title="\u7F51\u5173\u4E0E\u7CFB\u7EDF\u8BBE\u7F6E" style="
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: var(--text-secondary);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
          ">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>

          <!-- Inspector toggle -->
          <button id="toggle-inspector-btn" class="icon-btn" title="\u68C0\u67E5\u8231 (Cmd/Ctrl+\\)" style="
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: var(--text-secondary);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
          ">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="2" width="12" height="12" rx="2"/>
              <line x1="10" y1="2" x2="10" y2="14"/>
            </svg>
          </button>
        </div>

        ${isWin ? winControls : ""}
      </div>
    </header>
  `;
}
function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// ../ui/src/components/LeftRail/LeftRail.ts
function renderLeftRail(props) {
  if (props.collapsed) {
    return `<aside id="aura-left-rail" class="rail-collapsed" style="width: 0px; min-width: 0px; display: none; overflow: hidden;"></aside>`;
  }
  const activeSessions = props.sessions.filter((s) => !s.isArchived);
  const archivedSessions = props.sessions.filter((s) => s.isArchived);
  return `
    <aside id="aura-left-rail" class="aura-left-rail" style="
      width: 260px;
      min-width: 260px;
      max-width: 260px;
      height: 100%;
      background: var(--bg-rail);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      user-select: none;
      transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    ">
      <!-- Search & New Chat -->
      <div style="padding: 12px 14px 8px; display: flex; flex-direction: column; gap: 8px;">
        <button id="new-chat-btn" class="btn-new-chat" style="
          width: 100%;
          height: 34px;
          background: var(--bg-card);
          border: 1px solid var(--border-medium);
          border-radius: 8px;
          color: var(--text-main);
          font-size: 13px;
          font-weight: 500;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 6px;
          cursor: pointer;
          box-shadow: var(--shadow-card);
          transition: border-color 0.15s ease, background 0.15s ease;
        ">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="3" x2="8" y2="13"/>
            <line x1="3" y1="8" x2="13" y2="8"/>
          </svg>
          <span>+ \u65B0\u5EFA\u4F1A\u8BDD</span>
        </button>

        <div style="position: relative; width: 100%;">
          <input type="text" id="session-search-input" placeholder="\u641C\u7D22\u4F1A\u8BDD..." style="
            width: 100%;
            height: 28px;
            background: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 0 10px 0 28px;
            font-size: 12px;
            color: var(--text-main);
            outline: none;
            box-sizing: border-box;
          " />
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 9px; top: 8px; color: var(--text-muted);">
            <circle cx="7" cy="7" r="5"/>
            <line x1="11" y1="11" x2="15" y2="15"/>
          </svg>
        </div>
      </div>

      <!-- Session List Stream -->
      <div class="session-scroll-area" id="session-list-container" style="flex: 1; overflow-y: auto; padding: 6px 8px;">
        ${props.sessions.length === 0 ? `
          <div style="padding: 32px 12px; text-align: center; color: var(--text-muted); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>\u6682\u65E0\u5386\u53F2\u4F1A\u8BDD</span>
            <span style="font-size: 11px; color: var(--text-faint);">\u70B9\u51FB\u4E0A\u65B9\u6309\u94AE\u5F00\u542F\u5168\u65B0\u4EFB\u52A1</span>
          </div>
        ` : `
          <div style="font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 8px 4px;">\u8FD1\u671F\u4F1A\u8BDD (${props.sessions.length})</div>
          
          <div style="display: flex; flex-direction: column; gap: 2px;">
            ${activeSessions.map((s) => {
    const isActive = s.id === props.activeSessionId;
    return `
                <div class="session-item ${isActive ? "active" : ""}" data-id="${s.id}" style="
                  padding: 8px 10px;
                  border-radius: 7px;
                  background: ${isActive ? "var(--bg-card-active)" : "transparent"};
                  border: 1px solid ${isActive ? "var(--border-medium)" : "transparent"};
                  cursor: pointer;
                  transition: background 0.12s ease;
                  display: flex;
                  flex-direction: column;
                  gap: 3px;
                  position: relative;
                ">
                  <div style="display: flex; align-items: center; justify-content: space-between;">
                    <span class="session-title" style="font-size: 12px; font-weight: ${isActive ? "600" : "500"}; color: ${isActive ? "var(--text-main)" : "var(--text-secondary)"}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px;">${escapeHtml2(s.title || "\u672A\u547D\u540D\u4F1A\u8BDD")}</span>
                    ${s.time ? `<span style="font-size: 10px; color: var(--text-muted);">${escapeHtml2(s.time)}</span>` : ""}
                  </div>
                  ${s.preview ? `<div style="font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml2(s.preview)}</div>` : ""}
                </div>
              `;
  }).join("")}
          </div>

          ${archivedSessions.length > 0 ? `
            <div style="font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 14px 8px 4px;">\u5386\u53F2\u5F52\u6863</div>
            <div style="display: flex; flex-direction: column; gap: 2px;">
              ${archivedSessions.map(
    (s) => `
                <div class="session-item" data-id="${s.id}" style="padding: 7px 10px; border-radius: 6px; opacity: 0.7; cursor: pointer;">
                  <span style="font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block;">${escapeHtml2(s.title || "\u5386\u53F2\u5F52\u6863")}</span>
                </div>
              `
  ).join("")}
            </div>
          ` : ""}
        `}
      </div>

      <!-- Footer User Profile & Settings Trigger -->
      <div class="rail-footer" style="
        padding: 10px 14px;
        border-top: 1px solid var(--border-subtle);
        background: var(--bg-panel);
        display: flex;
        align-items: center;
        justify-content: space-between;
      ">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--theme-thumb-color, #090A0F);
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
          ">
            ${props.profileName ? props.profileName.charAt(0).toUpperCase() : "A"}
          </div>
          <div style="display: flex; flex-direction: column;">
            <span style="font-size: 11.5px; font-weight: 600; color: var(--text-main);">${escapeHtml2(props.profileName || "default")}</span>
            <span style="font-size: 9.5px; color: var(--text-muted); font-family: var(--font-mono);">${props.gatewayOnline ? "CONNECTED" : "STANDALONE"}</span>
          </div>
        </div>
        
        <button id="rail-footer-settings-btn" title="\u6253\u5F00\u8BBE\u7F6E" style="
          background: transparent;
          border: none;
          color: var(--text-secondary);
          cursor: pointer;
          padding: 4px;
          border-radius: 4px;
          display: flex;
          align-items: center;
          justify-content: center;
        ">

function escapeHtml3(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
function renderMarkdown(md) {
  let html = escapeHtml3(md);
  html = html.replace(/```([a-zA-Z0-9_-]+)?\n([\s\S]*?)```/g, (_match, lang, code) => {
    return `
      <div style="border-radius: 8px; overflow: hidden; border: 1px solid var(--border-medium); margin: 8px 0; background: var(--bg-code);">
        <div style="padding: 6px 12px; background: var(--bg-elevated); font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); display: flex; justify-content: space-between;">
          <span>${lang || "code"}</span>
        </div>
        <pre style="margin: 0; padding: 12px; overflow-x: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; color: #E2E8F0;"><code>${code}</code></pre>
      </div>
    `;
  });
  html = html.replace(/`([^`]+)`/g, '<code style="background: var(--bg-panel); border: 1px solid var(--border-subtle); padding: 2px 5px; border-radius: 4px; font-family: var(--font-mono); font-size: 12px; color: var(--accent);">$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const paragraphs = html.split("\n\n").filter((p) => p.trim().length > 0);
  return paragraphs.map((p) => `<p style="margin: 0;">${p.replace(/\n/g, "<br/>")}</p>`).join("");
}
