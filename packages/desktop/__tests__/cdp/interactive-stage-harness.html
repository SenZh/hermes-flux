<!DOCTYPE html>
<html lang="zh-CN" data-theme="obsidian-gold">
<head>
  <meta charset="UTF-8">
  <title>Hermes Flux Interactive Conversation Stage CDP Test Harness</title>
  <style>
    :root {
      --bg-window: #090A0F;
      --bg-rail: #0E1015;
      --bg-panel: #111318;
      --bg-card: #151720;
      --bg-card-hover: #1B1E29;
      --bg-card-active: #222634;
      --bg-elevated: #1F2230;
      --bg-input: #12141A;
      --bg-code: #0A0B10;
      --bg-backdrop: rgba(18, 20, 27, 0.88);
      --accent: #F59E0B;
      --accent-hover: #FBBF24;
      --accent-dim: #D97706;
      --accent-glow: rgba(245, 158, 11, 0.25);
      --accent-subtle: rgba(245, 158, 11, 0.09);
      --accent-border: rgba(245, 158, 11, 0.35);
      --accent-text: #FEF3C7;
      --accent-red: #EF4444;
      --text-main: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --text-faint: #334155;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-medium: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --specular-line: inset 0 1px 0 0 rgba(255, 255, 255, 0.10);
      --shadow-window: 0 24px 70px -12px rgba(0, 0, 0, 0.85);
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.45);
      --shadow-dock: 0 20px 48px -10px rgba(0, 0, 0, 0.75);
      --jade-pulse: #10B981;
      --jade-glow: rgba(16, 185, 129, 0.45);
      --font-sans: system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-window);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #stage-container {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px 32px 140px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="stage-container"></div>

  <script type="module">
    import { renderConversationCanvas } from '/packages/ui/dist/components/MiddlePod/MiddlePod.js';
    import { renderInputDock } from '/packages/ui/dist/components/InputDock/InputDock.js';

    // 模拟数据渲染
    const stage = document.getElementById('stage-container');

    const mockMessages = [
      {
        id: 'user-turn-1',
        rowId: 1,
        role: 'user',
        content: '请用 TypeScript 实现一个带有单调递增时钟和自动退避的状态机。',
        timestamp: '14:28:05',
        isGroupRoom: false,
        isBotRoom: false,
      },
      {
        id: 'ast-turn-1',
        rowId: 2,
        role: 'assistant',
        content: '这是经过架构防灾验证的五态 FSM 实现：\n\n```typescript\nexport class WebSocketFsm {\n  // 实现了全抖动退避\n}\n```',
        model: 'claude-3-7-sonnet',
        durationMs: 1850,
        ttftMs: 240,
        timestamp: '14:28:07',
        tokenMetrics: {
          total: 1420,
          input: 540,
          output: 880,
          tps: 76.5,
          cacheHitPct: 85,
          cacheRead: 459,
        },
        thought: '深入分析 WebSocketFsm 架构契约与重连退避算法...',
        thoughtDurationMs: 800,
        isGroupRoom: false,
      },
    ];

    const canvasHtml = renderConversationCanvas({
      gatewayConnected: true,
      messages: mockMessages,
      contextUsage: {
        used: 42000,
        max: 128000,
        percent: 33,
      },
    });

    const dockHtml = renderInputDock({
      selectedModel: 'anthropic/claude-3-7-sonnet',
      reasoningLevel: 'high',
      approvalMode: 'auto',
      isStreaming: false,
      modelMenuOpen: false,
      attachments: [
        { id: 'att-1', name: 'fsm.ts', type: 'file' },
      ],
      queuedMessages: [
        { id: 'q-1', text: '请顺便补齐边界值测试用例', model: 'claude-3-7-sonnet' },
      ],
      modelDetails: [
        { id: 'anthropic/claude-3-7-sonnet', provider: 'Anthropic', name: 'Claude 3.7 Sonnet', displayName: 'Claude 3.7', contextLength: 200000, supportsVision: true },
        { id: 'openai/gpt-4o', provider: 'OpenAI', name: 'GPT-4o', displayName: 'GPT-4o', contextLength: 128000, supportsVision: true },
      ],
    });

    stage.innerHTML = canvasHtml + dockHtml;

    // 交互事件绑定（回滚回填、Token Popover 展开、手风琴切换）
    document.addEventListener('click', (e) => {
      const target = e.target;
      const btn = target.closest('button') || target.closest('[data-action]');
      if (!btn) return;

      const action = btn.getAttribute('data-action');
      if (window.__fluxMessageActions) {
        if (action === 'copy-msg') void window.__fluxMessageActions.handleCopyMessage(btn);
        if (action === 'rollback-msg') window.__fluxMessageActions.handleRollbackMessage(btn);
        if (action === 'fork-msg') void window.__fluxMessageActions.handleForkMessage(btn);
        if (action === 'regenerate-msg') void window.__fluxMessageActions.handleRegenerateMessage(btn);
      } else if (action === 'rollback-msg') {
        const text = btn.getAttribute('data-content') || '';
        const textarea = document.getElementById('dock-prompt-input');
        if (textarea) {
          textarea.value = text;
          textarea.focus();
          document.body.setAttribute('data-last-rollback', text);
        }
      }

      if (action === 'toggle-token-popover') {
        const popover = btn.parentElement.querySelector('.token-metrics-popover');
        if (popover) {
          const isOpen = popover.style.display === 'block';
          popover.style.display = isOpen ? 'none' : 'block';
          document.body.setAttribute('data-token-popover-open', String(!isOpen));
        }
      }

      if (action === 'interrupt-and-push') {
        document.body.setAttribute('data-interrupted-and-pushed', 'true');
      }
    });

    // 绑定手风琴 Provider 点击
    document.querySelectorAll('.model-provider-group-header').forEach((hdr) => {
      hdr.addEventListener('click', () => {
        const group = hdr.closest('.model-provider-group');
        const items = group.querySelector('.model-provider-items');
        const arrow = hdr.querySelector('.provider-accordion-arrow');
        if (items) {
          const isCollapsed = items.style.display === 'none';
          items.style.display = isCollapsed ? 'block' : 'none';
          if (arrow) arrow.textContent = isCollapsed ? '▾' : '▸';
          document.body.setAttribute('data-provider-accordion-toggled', 'true');
        }
      });
    });

    window.__stageReady = true;
  </script>
</body>
</html>
